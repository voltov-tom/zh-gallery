# Прод-стек: Postgres, Redis, Django (gunicorn) и nginx с TLS.
# Образ тянется из публичного GHCR — на сервере ничего не собирается.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Секреты и домен — в .env рядом с этим файлом (chmod 600, в git не попадает).

name: zh_gallery

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${SQL_DATABASE:-zh_gallery}
      POSTGRES_USER: ${SQL_USER:-zh_gallery}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-zh_gallery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-zh_gallery} -d ${SQL_DATABASE:-zh_gallery}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 900 МБ RAM на всё: лимиты не дают контейнерам утащить хост в OOM
    mem_limit: 320m
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    security_opt: ["no-new-privileges:true"]

  # Тома создаются Docker'ом, и первым их монтирует nginx (root) — без явной
  # инициализации collectstatic и загрузка картинок падают с Permission denied.
  init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - "chown -R 1000:1000 /app/zh_gallery/static /app/zh_gallery/media /app/zh_gallery/media-cache"
    volumes:
      - static_volume:/app/zh_gallery/static
      - media_volume:/app/zh_gallery/media
      - media_cache:/app/zh_gallery/media-cache

  web:
    image: ghcr.io/voltov-tom/zh-gallery:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: zh_gallery.settings.production
      SQL_HOST: db
      SQL_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      MEDIA_ROOT: /app/zh_gallery/media
      MEDIA_CACHE_ROOT: /app/zh_gallery/media-cache
    volumes:
      - static_volume:/app/zh_gallery/static
      - media_volume:/app/zh_gallery/media
      - media_cache:/app/zh_gallery/media-cache
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          request = urllib.request.Request(
          'http://127.0.0.1:8000/healthz/',
          headers={'X-Forwarded-Proto': 'https'});
          urllib.request.urlopen(request, timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 384m
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - static_volume:/static:ro
      - media_volume:/srv/media:ro
    depends_on:
      init:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    mem_limit: 64m
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  media_cache:
