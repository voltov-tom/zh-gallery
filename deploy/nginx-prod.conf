# nginx для прода: HTTPS + редирект с HTTP, статика, медиа из Nextcloud через Django.
# Сертификат монтируется в /etc/nginx/certs (fullchain.pem + privkey.pem).

server {
    listen 80;
    server_name zh-gallery.ru www.zh-gallery.ru;

    # ACME-проверка на будущее (Let's Encrypt), сейчас каталога просто нет
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name zh-gallery.ru www.zh-gallery.ru;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    # X-Content-Type-Options и Referrer-Policy отдаёт Django; на /static/ — ниже

    client_max_body_size 25m;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker-DNS: иначе nginx запоминает IP контейнера web и отдаёт 502 после пересоздания
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Если бэкенд недоступен — отдаём страницу «технические работы» (503)
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /maintenance.html;

    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 600 always;
    }

    location /static/ {
        alias /static/;
        expires 30d;
        access_log off;
        # add_header в location перекрывает унаследованные, поэтому HSTS здесь явно
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Медиа хранятся в Nextcloud, отдаёт Django (core/views/media.py)
    location /media/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
