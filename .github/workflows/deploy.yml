name: Deploy

# Собирает образ, публикует его в публичный GHCR и деплоит на сервер по SSH.
# Требует секрет DEPLOY_SSH_KEY — приватный ключ пользователя deploy.

on:
  push:
    branches: [refactor]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check deploy key
        id: key
        # secrets нельзя использовать в if, поэтому проверяем их в run
        run: |
          if [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_SSH_KEY не задан — деплой пропущен"
          fi

      - name: Deploy over SSH
        if: steps.key.outputs.present == '1'
        uses: appleboy/ssh-action@v1
        with:
          host: zh-gallery.ru
          port: 10022
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd /srv/zh-gallery
            # сначала подтягиваем скрипт и конфиги из репозитория — серверная копия
            # deploy.sh не должна отставать от кода
            git -C src fetch -q origin refactor
            git -C src reset -q --hard origin/refactor
            cp -f src/deploy/deploy.sh src/deploy/docker-compose.prod.yml \
                  src/deploy/nginx-prod.conf src/deploy/maintenance.html .
            chmod +x deploy.sh
            IMAGE_TAG=${{ github.sha }} ./deploy.sh
