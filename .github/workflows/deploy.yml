name: Deploy

# Собирает образ, публикует его в публичный GHCR и деплоит на сервер по SSH.
# Требует секрет DEPLOY_SSH_KEY — приватный ключ пользователя deploy.

on:
  push:
    branches: [refactor]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        # пока секрет не добавлен — шаг просто пропускается, образ всё равно пушится
        if: ${{ env.DEPLOY_KEY != '' }}
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        uses: appleboy/ssh-action@v1
        with:
          host: zh-gallery.ru
          port: 10022
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            cd /srv/zh-gallery
            IMAGE_TAG=${{ github.sha }} ./deploy.sh
