name: Deploy

# Собирает образ, публикует его в публичный GHCR и деплоит на сервер по SSH.
# Требует секрет DEPLOY_SSH_KEY — приватный ключ пользователя deploy.

on:
  push:
    branches: [refactor]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        # Ключ ищем под несколькими частыми именами: секрет мог быть назван иначе.
        # Если не нашли — предупреждаем и выходим, образ всё равно уже в GHCR.
        env:
          KEY_DEPLOY_SSH: ${{ secrets.DEPLOY_SSH_KEY }}
          KEY_DEPLOY: ${{ secrets.DEPLOY_KEY }}
          KEY_SSH: ${{ secrets.SSH_KEY }}
          KEY_DEPLOY_PRIVATE: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          KEY="${KEY_DEPLOY_SSH:-${KEY_DEPLOY:-${KEY_SSH:-${KEY_DEPLOY_PRIVATE:-}}}}"
          if [ -z "$KEY" ]; then
            echo "::warning::Ключ деплоя не найден в секретах (DEPLOY_SSH_KEY / DEPLOY_KEY / SSH_KEY / DEPLOY_SSH_PRIVATE_KEY)"
            exit 0
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
              -p 10022 -i ~/.ssh/deploy_key deploy@zh-gallery.ru \
              "cd /srv/zh-gallery && \
               git -C src fetch -q origin refactor && \
               git -C src reset -q --hard origin/refactor && \
               cp -f src/deploy/deploy.sh src/deploy/docker-compose.prod.yml \
                     src/deploy/nginx-prod.conf src/deploy/maintenance.html . && \
               chmod +x deploy.sh && \
               IMAGE_TAG=${{ github.sha }} ./deploy.sh"
