name: CI

on:
  push:
    branches: [master, modernization, refactor]
  pull_request:
  # чтобы deploy.yml мог вызывать этот workflow как переиспользуемый
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (CVE в зависимостях)
        run: |
          pip install -q pip-audit
          # база тянется из сети: сетевые сбои ретраим, найденные CVE — нет
          set +e
          for attempt in 1 2 3; do
            pip-audit -r requirements.txt
            status=$?
            [ "$status" -eq 0 ] && exit 0
            if [ "$status" -eq 1 ]; then
              echo "::error::в зависимостях есть известные уязвимости"
              exit 1
            fi
            echo "сетевая ошибка (код $status), попытка $attempt из 3"
            sleep 10
          done
          exit "$status"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Django checks
        run: |
          cd zh_gallery
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: pytest
        run: pytest --cov --cov-report=term-missing
