# Стек проекта: PostgreSQL, Redis, Django (gunicorn), nginx и Mailpit для писем.
# Запуск:  cp .env.example .env && docker compose up --build
# Сайт:    http://localhost:8080     Письма:  http://localhost:8025
#
# Порты специально не совпадают с продакшн-стеком (80/8000), чтобы рядом
# можно было держать боевую копию проекта.

name: zh_gallery

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${SQL_DATABASE:-zh_gallery}
      POSTGRES_USER: ${SQL_USER:-zh_gallery}
      POSTGRES_PASSWORD: ${SQL_PASSWORD:-zh_gallery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:-zh_gallery} -d ${SQL_DATABASE:-zh_gallery}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Тома static/media создаёт Docker, и владельцем становится тот контейнер,
  # который смонтировал их первым (у nginx это root). Инициализируем их явно,
  # иначе collectstatic и загрузка картинок падают с Permission denied.
  init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - "chown -R 1000:1000 /app/zh_gallery/static /app/zh_gallery/media /app/zh_gallery/media-cache"
    volumes:
      - static_volume:/app/zh_gallery/static
      - media_volume:/app/zh_gallery/media
      - media_cache:/app/zh_gallery/media-cache

  web:
    build:
      context: .
      target: base
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: zh_gallery.settings.production
      SQL_HOST: db
      SQL_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      MEDIA_ROOT: /app/zh_gallery/media
      MEDIA_CACHE_ROOT: /app/zh_gallery/media-cache
    volumes:
      - static_volume:/app/zh_gallery/static
      - media_volume:/app/zh_gallery/media
      - media_cache:/app/zh_gallery/media-cache
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # NGINX_CONF=./docker/nginx-nextcloud.conf, когда медиа лежит в Nextcloud
      - ${NGINX_CONF:-./docker/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
      - static_volume:/static:ro
      - media_volume:/srv/media:ro
    depends_on:
      init:
        condition: service_completed_successfully
      web:
        condition: service_healthy

  # Локальный SMTP-приёмник (веб-интерфейс на :8025). Нужен только если хочется
  # посмотреть письма регистрации: docker compose --profile mail up -d mailpit.
  # По умолчанию письма печатаются в лог контейнера (console backend).
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500

  # Тесты и линтеры: отдельный образ с dev-зависимостями.
  #   docker compose --profile tools run --rm test pytest
  test:
    profiles: ["tools"]
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: zh_gallery.settings.test
    volumes:
      - ./zh_gallery:/app/zh_gallery

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  media_cache:
